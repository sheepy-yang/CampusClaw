# CampusClaw：web + Qdrant。Qdrant 端口不映射到宿主机。
# 关系库仍是容器内 SQLite（迭代 1 D12）；向量只进 Qdrant，正文不进 payload。
services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: campusclaw-qdrant
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  web:
    build: .
    image: campusclaw:iter1
    container_name: campusclaw
    depends_on:
      - qdrant
    # .env 注入 SESSION_SECRET 与种子口令；缺失则容器内 python run.py 退出码 1（D6 仍然成立）
    env_file:
      - .env
    # compose 的 environment 优先级高于 env_file，强制容器内监听 0.0.0.0
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - QDRANT_URL=http://qdrant:6333
    ports:
      - "5000:5000"
    # 持久化：down 不删 volume；down -v 才清空。volume 承载 campusclaw.db 与 uploads/
    volumes:
      - campusclaw-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  campusclaw-data:
  qdrant-data:
